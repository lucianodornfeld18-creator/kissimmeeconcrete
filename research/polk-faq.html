<section class="cpt-25">
	<div class="event">
		<div class="event-details bg-white min-height-auto cbr-20">
			<div class="headline blue-bar">
				<h3 class="mt-2 mb-2">
					<a data-bs-toggle="collapse" href="#top_contact32" role="button" aria-expanded="false" aria-controls="top_contact" class="c12819f custom-accord">What work does and does not require a permit?</a>
				</h3>
			</div>
			<div class="collapse" id="top_contact32">
				<div><p>Section 105.1 of the Florida Building Code states that a permit is required to construct, enlarge, alter, repair, move, demolish or change the occupancy or occupant content of a building or structure or to erect, install, enlarge, alter, repair, remove, convert or replace any electrical, gas, mechanical or plumbing system, the installation of which is regulated by the technical codes.</p>
<p>Work that requires an inspection to verify compliance with the applicable technical code requires a construction permit.</p>
<p>Separate electrical, mechanical or plumbing permits may be required even if a building permit is not required. Following are examples of work that does and does not require a permit. These examples are not all inclusive and there will be situations that are not addressed here. If you have a question as to permit requirements, call our Bartow office at <a href="tel:(863)534-6080" target="_blank" rel="noopener">(863) 534-6080</a> and ask to speak with a plans examiner.</p>
<p><strong>Work Requiring a Construction Permit</strong></p>
<ul>
<li>Construction or demolition of any building or structure regardless of size.</li>
<li>All new construction, including additions and any alterations, renovations or remodels involving structural elements or involving any electrical, plumbing, fuel gas, fire systems, pollutant storage tanks, on-site underground utilities, signs or mechanical systems.</li>
<li>Alterations, renovations, remodels or modifications to any commercial structure affecting occupancy classification, means of egress, fire resistance ratings or handicap accessibility.</li>
<li>The installation, alteration, replacement, extension or repair of any irrigation, electrical, plumbing, mechanical work, fuel gas, fire systems, solar systems or any associated electrical work (low voltage) including the change out of A/C equipment, electrical service changes or the addition of electrical outlets or circuits.</li>
<li>Conversion of any non-habitable space to habitable space including the enclosure of garages, carports, porches or similar structures and the replacement of screening or vinyl windows with glass or solid walls.</li>
<li>Screening of any space, which requires structural or infill framing to be added.</li>
<li>All foundation remediation work to assure that an engineer is overseeing the work.</li>
<li>Any change in occupancy as defined by the building code.</li>
<li>Commercial and residential docks, piers, sea walls, boathouses, bulkheads and boat ramps.</li>
<li>All masonry walls and fences with masonry pilasters. All solid fences over eight feet high.</li>
<li>Retaining walls required for structural support, protection or erosion.</li>
<li>Decorative retaining walls. Call (863) 534-6080 and ask for a plans examiner for information.</li>
<li>Concrete slabs adjacent to a principal or accessory structure, intended for support of a structure, elevated slabs, sidewalks and portions of driveways in the right of way or within the minimum setbacks. Note: All slabs shall meet minimum setbacks from property lines and easements, except sidewalk and driveways. Building Code and Land Development Code drainage requirements shall be met.</li>
<li>Pavers installed within the required setbacks or adjacent to structures. Note: Shall meet Building Code and LDC Requirements.</li>
<li>Tents over 900 square feet or larger for public assembly or use or having electrical lighting.</li>
<li>Pre-manufactured storage buildings, residential buildings and commercial buildings.</li>
<li>Additions, repairs, alterations or accessory structures to mobile homes or park trailers. Owners of a mobile home or park trailer situated on a rented lot will not be able to permit additions as owner builders without notarized landowner consent.</li>
<li>Mobile home and park trailer set-ups. Owners of a mobile home or park trailer situated on a rented lot will not be able to permit additions as owner builders without notarized landowner consent.</li>
<li>In ground swimming pools and spas. Above ground swimming pools and spas more than 24&#8243; deep.</li>
<li>Pool/spa repairs, renovations, demolitions and remodels involving structural elements, electrical, gas, solar, geothermal work or additional equipment.</li>
<li>All re-roofing including mobile homes and park trailers and including installation of insulated roof coverings.</li>
<li>Decks, walkways, platforms, stairs and landings. All shall meet setbacks and shall not encroach in easements.</li>
<li>All carports or similar structures with rigid roofs.</li>
<li>All flagpole foundations and poles greater than 50 feet high.</li>
<li>Replacement of skylights, windows and doors including garage doors.</li>
<li>Installation or replacement of vinyl or acrylic windows.</li>
<li>Plumbing re-pipes and water heater change outs.</li>
<li>Installation or replacement of security bars or permanently installed window and door shutters.</li>
<li>Siding and soffit replacement or installation.</li>
<li>Handicap ramps require a permit and must meet setbacks.</li>
<li>Tree houses require a permit with sealed engineered plans. Exception: residential tree houses that meet the following criteria:<br />
1) Tree houses with maximum floor area of 32 square feet.<br />
2) May have up to a 30 inch knee wall.<br />
3) Shall meet minimum LDC Accessory Structure setback requirements.<br />
4) Shall be totally supported by tree.<br />
5) Shall have no electrical or plumbing.<br />
6) Shall have no roof.<br />
7) Maximum of one tree house per residential lot.</li>
</ul>
<p><strong>Work Not Requiring A Construction Permit</strong></p>
<ul>
<li>Minor roof repairs &#8211; less than 25 percent as determined by the Building Official or Plans Examiner Supervisor based on type and location of damage. Call <a href="tel:8635346080">(863) 534-6080</a> and ask for a Plans Examiner Supervisor.</li>
<li>Replacement of screening with like material in an existing structure.</li>
<li>Interior remodels, interior renovations or interior repairs on ANSI units or RVs.</li>
<li>Minor electrical, plumbing, mechanical repairs only, no extensions or modifications.</li>
<li>Chain link fences and stockade fences up to eight feet high. Check Polk County Land Development Code for prohibited materials for fencing.</li>
<li>Structures intended for storage use only (prefabricated and of a &#8220;Closet&#8221; use). You may reach in only, not walk-in. These exempt structures are limited to a maximum 5 ft. height (mean height), 50 sq. ft. maximum area and a maximum 250 cubic ft. with no electrical or plumbing.</li>
</ul>
