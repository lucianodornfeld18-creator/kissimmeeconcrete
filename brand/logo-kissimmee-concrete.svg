<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1968 436" width="1968" height="436" role="img" aria-labelledby="t d">
  <title id="t">Kissimmee Concrete</title>
  <desc id="d">Gold and charcoal K mark with the Kissimmee Concrete wordmark. Clean vector interpretation of the owner-supplied logo.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3A64A"/>
      <stop offset="0.55" stop-color="#B07828"/>
      <stop offset="1" stop-color="#8A5D1C"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>
  <!-- K mark: upright stem (gold top, charcoal base), two gold diagonals, white sweep -->
  <rect x="40" y="20" width="120" height="200" fill="url(#g)"/>
  <rect x="40" y="228" width="120" height="188" fill="url(#c)"/>
  <polygon points="168,20 300,20 168,196" fill="url(#g)"/>
  <polygon points="300,20 430,20 250,236 168,236 168,196" fill="url(#g)"/>
  <polygon points="200,240 296,240 440,416 330,416" fill="url(#g)"/>
  <path d="M40 232 C 160 200, 300 190, 440 260 L 440 276 C 300 214, 160 226, 40 246 Z" fill="#FFFFFF"/>
  <!-- wordmark -->
  <text x="500" y="182" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="168" letter-spacing="4" fill="#1A1A1A">KISSIMMEE</text>
  <text x="560" y="296" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="112" letter-spacing="30" fill="#B07828">CONCRETE</text>
  <text x="502" y="382" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="46" letter-spacing="9" fill="#1A1A1A">DRIVEWAYS · PATIOS · WALKWAYS · MORE</text>
</svg>
